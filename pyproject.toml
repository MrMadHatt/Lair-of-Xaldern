[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
 target-version = ["py311"]
 exclude = '''
 (
        data_sync.py 
    |   format.py 
 )
 '''

 [tool.ruff]
 line-length = 88
 target-version = "py311"
 select = ["E", "F", "W"]
 ignore = []
 exclude = [
     "data_sync.py",
     "format.py"
 ]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

 [tool.pytest.ini_options]
 pythonpath = ["."]
 testpaths = ["tests"]